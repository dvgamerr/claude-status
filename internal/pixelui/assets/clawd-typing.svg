<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Clawd Typing</title>
  <g id="monitor" fill="#2B2E3B">
    <rect x="24" y="2" width="52" height="28"/>
    <g fill="#E8544A">
      <rect x="28" y="6" width="4" height="4"/>
    </g>
    <g fill="#E8A93F">
      <rect x="34" y="6" width="4" height="4"/>
    </g>
    <g fill="#3FAE5A">
      <rect x="40" y="6" width="4" height="4"/>
    </g>
    <g fill="#3FAE5A">
      <rect x="28" y="15" width="20" height="3">
        <animate attributeName="width" calcMode="discrete"
          values="20;26;14;22" keyTimes="0;0.33;0.66;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <g id="body" fill="#D97757">
    <rect x="22" y="33" width="56" height="34"/>
  </g>
  <g id="legs" fill="#D97757">
    <rect x="30" y="67" width="6" height="15"/>
    <rect x="40" y="67" width="6" height="15"/>
    <rect x="54" y="67" width="6" height="15"/>
    <rect x="64" y="67" width="6" height="15"/>
  </g>
  <g id="eyes" fill="#000">
    <rect x="36" y="41" width="5" height="10"/>
    <rect x="59" y="41" width="5" height="10"/>
    <animate attributeName="opacity" calcMode="discrete"
      values="1;1;0;1" keyTimes="0;0.9;0.95;1" dur="3.2s" repeatCount="indefinite"/>
  </g>
  <g id="leftArm" fill="#D97757">
    <rect x="15" y="58" width="11" height="10"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,0;0,3;0,0;0,3;0,0" keyTimes="0;0.25;0.5;0.75;1" dur="0.5s" repeatCount="indefinite"/>
  </g>
  <g id="rightArm" fill="#D97757">
    <rect x="74" y="58" width="11" height="10"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,3;0,0;0,3;0,0;0,3" keyTimes="0;0.25;0.5;0.75;1" dur="0.5s" repeatCount="indefinite"/>
  </g>
  <g id="keyboard" fill="#5B6472">
    <rect x="14" y="66" width="72" height="14"/>
    <g fill="#828C9C">
      <rect x="18" y="70" width="64" height="3"/>
      <rect x="18" y="75" width="64" height="3"/>
    </g>
  </g>
</svg>
