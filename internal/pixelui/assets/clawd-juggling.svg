<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Clawd Juggling</title>
  <g id="leftArm" fill="#D97757">
    <rect x="10" y="46" width="12" height="12"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,0;0,-4;0,0" dur="0.4s" begin="0s" repeatCount="indefinite"/>
  </g>
  <g id="rightArm" fill="#D97757">
    <rect x="78" y="46" width="12" height="12"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,-4;0,0;0,-4" dur="0.4s" begin="0s" repeatCount="indefinite"/>
  </g>
  <g id="body" fill="#D97757">
    <rect x="22" y="33" width="56" height="34"/>
  </g>
  <g id="legs" fill="#D97757">
    <rect x="30" y="67" width="6" height="15"/>
    <rect x="40" y="67" width="6" height="15"/>
    <rect x="54" y="67" width="6" height="15"/>
    <rect x="64" y="67" width="6" height="15"/>
  </g>
  <g id="shoes" fill="#000">
    <rect x="30" y="82" width="40" height="4"/>
  </g>
  <g id="eyes" fill="#000">
    <rect x="36" y="41" width="5" height="10"/>
    <rect x="59" y="41" width="5" height="10"/>
    <animate attributeName="opacity" calcMode="discrete"
      values="1;1;0;1" keyTimes="0;0.9;0.95;1" dur="3.2s" repeatCount="indefinite"/>
  </g>
  <g id="ball1" fill="#3FAE5A" transform="translate(30,30)">
    <circle cx="0" cy="0" r="5"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,0;0,-24;0,0" dur="1.2s" begin="0s" repeatCount="indefinite"/>
  </g>
  <g id="ball2" fill="#E8A93F" transform="translate(50,30)">
    <circle cx="0" cy="0" r="5"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,0;0,-24;0,0" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
  </g>
  <g id="ball3" fill="#D9544A" transform="translate(70,30)">
    <circle cx="0" cy="0" r="5"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,0;0,-24;0,0" dur="1.2s" begin="0.8s" repeatCount="indefinite"/>
  </g>
</svg>
