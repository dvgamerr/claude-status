<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Clawd Thinking</title>
  <g id="figure">
    <animateTransform attributeName="transform" type="translate"
      values="0,0;0,-3;0,0" dur="1.6s" repeatCount="indefinite"/>
    <g id="leftArm" fill="#D77757">
      <rect x="16" y="28" width="9" height="11"/>
    </g>
    <g id="rightArm" fill="#D77757">
      <rect x="78" y="43" width="10" height="14"/>
    </g>
    <g id="body" fill="#D77757">
      <rect x="22" y="33" width="56" height="34"/>
    </g>
    <g id="legs" fill="#D77757">
      <rect x="30" y="67" width="6" height="15"/>
      <rect x="40" y="67" width="6" height="15"/>
      <rect x="54" y="67" width="6" height="15"/>
      <rect x="64" y="67" width="6" height="15"/>
    </g>
    <g id="shoes" fill="#000">
      <rect x="30" y="82" width="40" height="4"/>
    </g>
    <g id="eyes" fill="#000">
      <rect x="36" y="41" width="5" height="10"/>
      <rect x="59" y="41" width="5" height="10"/>
      <animate attributeName="opacity" calcMode="discrete"
        values="1;1;0;1" keyTimes="0;0.9;0.95;1" dur="3.2s" repeatCount="indefinite"/>
    </g>
  </g>
  <g id="thoughtBubble" fill="#CFE3F2">
    <circle cx="66" cy="24" r="2"/>
    <circle cx="72" cy="17" r="3"/>
    <circle cx="80" cy="6" r="8"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,6;0,-4;0,6" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.85;0.3" dur="2.2s" repeatCount="indefinite"/>
  </g>
</svg>
