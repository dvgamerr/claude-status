<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Clawd Headphones Groove</title>
  <g id="figure">
    <animateTransform attributeName="transform" type="translate"
      values="0,0;0,-5;0,0" dur="0.7s" repeatCount="indefinite"/>
    <g id="leftArm" fill="#D97757">
      <rect x="12" y="43" width="10" height="14"/>
      <animateTransform attributeName="transform" type="translate"
        values="0,0;0,-4;0,0" dur="0.35s" repeatCount="indefinite"/>
    </g>
    <g id="rightArm" fill="#D97757">
      <rect x="78" y="43" width="10" height="14"/>
      <animateTransform attributeName="transform" type="translate"
        values="0,-4;0,0;0,-4" dur="0.35s" repeatCount="indefinite"/>
    </g>
    <g id="body" fill="#D97757">
      <rect x="22" y="33" width="56" height="34"/>
    </g>
    <g id="legs" fill="#D97757">
      <rect x="30" y="67" width="6" height="15"/>
      <rect x="40" y="67" width="6" height="15"/>
      <rect x="54" y="67" width="6" height="15"/>
      <rect x="64" y="67" width="6" height="15"/>
    </g>
    <g id="shoes" fill="#000">
      <rect x="30" y="82" width="40" height="4"/>
    </g>
    <g id="eyes" stroke="#000" stroke-width="2" fill="none">
      <path d="M35,44 L38.5,49 L42,44"/>
      <path d="M58,44 L61.5,49 L65,44"/>
    </g>
    <g id="headphones" fill="#1E5C84">
      <rect x="24" y="20" width="52" height="5"/>
      <rect x="24" y="25" width="4" height="10"/>
      <rect x="72" y="25" width="4" height="10"/>
      <rect x="16" y="33" width="9" height="16"/>
      <rect x="75" y="33" width="9" height="16"/>
    </g>
  </g>
</svg>
