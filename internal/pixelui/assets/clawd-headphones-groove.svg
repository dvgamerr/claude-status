<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Clawd Headphones Groove</title>
  <g id="legs" fill="#1E5C84">
    <rect x="34" y="78" width="10" height="14"/>
    <rect x="56" y="78" width="10" height="14"/>
  </g>
  <g id="torso" fill="#D77757">
    <rect x="30" y="38" width="40" height="40"/>
  </g>
  <g id="leftArm" fill="#D77757">
    <rect x="16" y="44" width="14" height="30"/>
  </g>
  <g id="rightArm" fill="#D77757">
    <rect x="70" y="44" width="14" height="30"/>
  </g>
  <g id="upperBody">
    <animateTransform attributeName="transform" type="translate"
      values="0,0;0,-5;0,0" dur="0.7s" repeatCount="indefinite"/>
    <g id="head" fill="#D77757">
      <rect x="35" y="8" width="30" height="30"/>
      <g id="eyes" fill="#000">
        <rect x="42" y="20" width="4" height="6"/>
        <rect x="54" y="20" width="4" height="6"/>
        <animate attributeName="opacity" calcMode="discrete"
          values="1;1;0;1" keyTimes="0;0.9;0.95;1" dur="3.2s" repeatCount="indefinite"/>
      </g>
      <g fill="#000">
        <rect x="46" y="30" width="8" height="3"/>
      </g>
    </g>
    <g id="headphones" fill="#1E5C84">
      <rect x="33" y="3" width="34" height="5"/>
      <rect x="29" y="16" width="8" height="14"/>
      <rect x="63" y="16" width="8" height="14"/>
    </g>
  </g>
</svg>
