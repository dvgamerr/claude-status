version: "3.8"

networks:
  lab:
volumes:
  grafana_data:
  loki_data:

services:
  loki:
    image: grafana/loki:2.9.2
    restart: unless-stopped
    volumes:
      - loki_data:/data/loki
      - ./config/loki.yaml:/mnt/config/loki-config.yaml
    ports:
      - 3100:3100
    command: -config.file=/mnt/config/loki-config.yaml
    networks:
      - lab
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1
      interval: 60s
      retries: 5
      start_period: 60s
      timeout: 2s
    
  grafana:
    image: grafana/grafana:10.2.0
    restart: unless-stopped
    depends_on:
      - loki
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./config/grafana.ini:/etc/grafana/grafana.ini
    ports:
      - "3000:3000"
    networks:
      - lab
    healthcheck:
      test: curl --fail http://localhost:3000/healthz || exit 1
      interval: 60s
      retries: 5
      start_period: 60s
      timeout: 3s

