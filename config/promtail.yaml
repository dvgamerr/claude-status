server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://10.203.1.200:3100/loki/api/v1/push

scrape_configs:
- job_name: page-errcode
  pipeline_stages:
  - json:
      expressions:
        ts: ts
        level: level
        logger: logger
        status: status
        msg: msg
        bytes_read: bytes_read
        loggerName: loggerName
        user_id: user_id
        duration: duration
        size: size
        proto: request.proto
        method: request.method
        host: request.host
        uri: request.uri
        ip_connecting: request.headers."Cf-Connecting-Ip"[0]
        ip_country: request.headers."Cf-Ipcountry"[0]
        user_agent: request.headers."User-Agent"[0]

  - labels:
      ts:
      level:
      status:
      duration:
      size:
      proto:
      method:
      host:
      uri:
      ip_connecting:
      ip_country:
      user_agent:
  - timestamp:
      source: ts
      format: Unix
      location: Asia/Bangkok
  - template:
      source: output
      template: "\
        [{{ ToUpper .level }}\
        {{ if .status }}\
          -{{ .status }}] {{ .ip_country }}:{{ .ip_connecting }} {{ .method }} {{ .host }}{{ .uri }} | {{ .msg }}\
        {{ else }}\
          ] {{ .msg }}\
        {{ end }}"
  - output:
      source: output

  static_configs:
  - targets:
      - localhost
    labels:
      job: page-errcode
      instance: caddy
      __path__: /var/log/caddy/*.access.log
